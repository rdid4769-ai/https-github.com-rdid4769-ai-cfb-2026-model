name: Refresh 2026 CFB scores
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/refresh_scores.py --output-dir output
      - run: python scripts/audit_scores.py --input output/completed_2026_scores.csv --output output/audit.json
      - run: python scripts/collect_drives.py --scores output/completed_2026_scores.csv --output-dir output
      - run: python scripts/classify_drives.py --raw output/raw_2026_drives.csv --scores output/completed_2026_scores.csv --output output/verified_2026_drives.csv --report output/scoring_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-2026-scores
          path: output/
          retention-days: 30
